project:
  device: "cuda"
  seed: 42

data:
  modality: "CT"
  patient_ids: ["1", "2", "3", "4", "5"]
  split_counts:
    train: 4   # change these numbers to control train/val/test patient counts
    val: 1
    test: 0
  image_size: 512
  channels: 1
  centered: true   # if true, images are in [-1, 1]; if false, images are in [0, 1]
  use_mu: true
  mu_water: 0.02
  hu_clip_range: [-1024, 4000]
  batch_size: 8
  num_workers: 4
  pin_memory: true

diffusion:
  steps: 1000
  sample_steps: 100
  eta: 0.0
  ddim:
    preview_t0: 400          # time step used when creating "Noisy t=..." previews
    preview_steps: 50        # DDIM reverse steps for the preview denoising loop
    sample_batch: 4          # number of samples saved in samples_epoch_*.png

training:
  epochs: 500
  lr: 2.0e-4
  save_interval: 10
  output_dir: "outputs/ddpm/chest"