project:
# 数据集 [dataset]
data:
train_dir: data/train_images # 支持 .png/.jpg/.npy（HWC 或 HW）
val_dir: data/val_images
img_size: 256 # 训练分辨率 [resolution]
channels: 1 # CT slice 通常为单通道
num_workers: 8
dtype: float32
normalize: [-1.0, 1.0] # 像素归一化到区间 [-1,1]
use_random_flip: true
use_random_rot90: false # 医学图像可按需关闭随机旋转


# 模型 [model]
model:
in_channels: 1
base_channels: 128
channel_mults: [1, 2, 2, 2] # 每层通道倍率
num_res_blocks: 2
dropout: 0.0
use_attention: [false, true, true, false] # 与 channel_mults 对齐，在中间层启用 [self-attention]
attn_heads: 4
time_embed_dim: 512


# 扩散过程 [diffusion]
diffusion:
steps: 1000 # T
beta_schedule: cosine # {linear, cosine}
beta_start: 1.0e-4 # 仅当 linear 时生效
beta_end: 0.02
objective: eps # 预测噪声 ε；可选 x0
sample_steps: 50 # 采样时步数（可用 DDIM）
sampler: ddim # {ddpm, ddim}
eta: 0.0 # DDIM 温度（0 = 确定性）


# 训练 [training]
training:
batch_size: 16
epochs: 200
log_interval: 100
val_interval_steps: 1000
ckpt_interval_steps: 5000
amp: true # [mixed precision]
ema:
use_ema: true
decay: 0.9999


# 优化器 [optimizer]
optimizer:
name: adamw
lr: 2.0e-4
betas: [0.9, 0.999]
weight_decay: 0.0


# 学习率调度 [lr scheduler]
scheduler:
name: cosine
warmup_steps: 1000